services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/demo.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
